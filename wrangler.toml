name = "hextube"
main = "worker.js"
compatibility_date = "2026-11-08"
workers_dev = true

[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hextube-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]
